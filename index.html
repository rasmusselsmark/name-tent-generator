<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Name Tent Generator</title>
<style>
  :root {
    --page-margin: 5mm;
    --cols: 2;
    --rows: 5;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #e5e5e5;
  }

  .controls {
    max-width: 210mm;
    margin: 16px auto;
    padding: 16px;
    background: #fff;
    border-radius: 8px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 12px 20px;
  }
  .controls textarea {
    width: 100%;
    height: 160px;
    font: inherit;
    padding: 8px;
  }
  .controls .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 200px;
  }
  .controls button {
    font: inherit;
    font-size: 1.1em;
    padding: 10px;
    cursor: pointer;
  }
  .controls .hint { grid-column: 1 / -1; color: #666; font-size: 0.9em; margin: 0; }

  .page {
    width: 210mm;
    height: 297mm;
    margin: 0 auto 16px;
    padding: var(--page-margin);
    background: #fff;
    display: grid;
    grid-template-columns: repeat(var(--cols), 1fr);
    grid-template-rows: repeat(var(--rows), 1fr);
    page-break-after: always;
    break-after: page;
    overflow: hidden;
  }

  .tent {
    position: relative;
    display: grid;
    grid-template-rows: 1fr 1fr;
    outline: 0.3mm dashed #888;
    outline-offset: -0.15mm;
    min-width: 0;
    min-height: 0;
  }
  .tent.empty .face span { visibility: hidden; }

  .face {
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 0 4mm;
    min-height: 0;
  }
  .face span {
    font-family: var(--name-font, "Arial Rounded MT Bold", "Comic Sans MS", system-ui, sans-serif);
    font-weight: bold;
    white-space: nowrap;
    line-height: 1;
  }
  .face.top { transform: rotate(180deg); }

  .fold {
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    border-top: 0.2mm dotted #bbb;
  }

  @page { size: A4; margin: 0; }

  @media print {
    body { background: none; }
    .controls { display: none; }
    .page { margin: 0; }
    .page:last-child { page-break-after: auto; break-after: auto; }
  }
</style>
</head>
<body>

<div class="controls">
  <textarea id="names" placeholder="One name per line (or comma separated)"></textarea>
  <div class="options">
    <label><input type="checkbox" id="firstOnly" checked> First name only</label>
    <label><input type="checkbox" id="uppercase"> UPPERCASE</label>
    <label>Max text size
      <input type="range" id="maxSize" min="8" max="24" value="18"> <span id="maxSizeLabel"></span>
    </label>
    <label>Font
      <select id="font">
        <option value='"Arial Rounded MT Bold", "Comic Sans MS", system-ui, sans-serif'>Rounded</option>
        <option value='"Comic Sans MS", "Comic Neue", cursive'>Comic</option>
        <option value='Arial, Helvetica, sans-serif'>Arial</option>
        <option value='Georgia, serif'>Serif</option>
        <option value='"Courier New", monospace'>Code (monospace)</option>
      </select>
    </label>
    <button onclick="window.print()">🖨️ Print</button>
  </div>
  <p class="hint">
    Print at 100% scale (no "fit to page"), with headers/footers off. Cut along the dashed lines, fold along the dotted line in the middle.
    The top half is printed upside down so the name reads correctly on both sides of the tent.
  </p>
</div>

<div id="pages"></div>

<script>
  const PER_PAGE = 10;
  const els = {
    names: document.getElementById('names'),
    firstOnly: document.getElementById('firstOnly'),
    uppercase: document.getElementById('uppercase'),
    maxSize: document.getElementById('maxSize'),
    maxSizeLabel: document.getElementById('maxSizeLabel'),
    font: document.getElementById('font'),
    pages: document.getElementById('pages'),
  };

  function parseNames() {
    return els.names.value
      .split(/[\n,;]+/)
      .map(n => n.trim())
      .filter(Boolean)
      .map(n => els.firstOnly.checked ? n.split(/\s+/)[0] : n)
      .map(n => els.uppercase.checked ? n.toUpperCase() : n);
  }

  function makeTent(name) {
    const tent = document.createElement('div');
    tent.className = 'tent' + (name ? '' : ' empty');
    for (const pos of ['top', 'bottom']) {
      const face = document.createElement('div');
      face.className = 'face ' + pos;
      const span = document.createElement('span');
      span.textContent = name || ' ';
      face.appendChild(span);
      tent.appendChild(face);
    }
    const fold = document.createElement('div');
    fold.className = 'fold';
    tent.appendChild(fold);
    return tent;
  }

  function fitText(span) {
    const face = span.parentElement;
    const max = Number(els.maxSize.value);
    const avail = face.clientWidth - parseFloat(getComputedStyle(face).paddingLeft) * 2;
    const availH = face.clientHeight * 0.85;
    span.style.fontSize = max + 'mm';
    const scale = Math.min(1, avail / span.offsetWidth, availH / span.offsetHeight);
    span.style.fontSize = (max * scale) + 'mm';
  }

  function render() {
    localStorage.setItem('nameTents', JSON.stringify({
      names: els.names.value,
      firstOnly: els.firstOnly.checked,
      uppercase: els.uppercase.checked,
      maxSize: els.maxSize.value,
      font: els.font.value,
    }));
    els.maxSizeLabel.textContent = els.maxSize.value + ' mm';
    document.documentElement.style.setProperty('--name-font', els.font.value);

    const names = parseNames();
    const pageCount = Math.max(1, Math.ceil(names.length / PER_PAGE));
    els.pages.innerHTML = '';
    for (let p = 0; p < pageCount; p++) {
      const page = document.createElement('div');
      page.className = 'page';
      for (let i = 0; i < PER_PAGE; i++) {
        page.appendChild(makeTent(names[p * PER_PAGE + i]));
      }
      els.pages.appendChild(page);
    }
    document.querySelectorAll('.tent:not(.empty) .face span').forEach(fitText);
  }

  const saved = JSON.parse(localStorage.getItem('nameTents') || 'null');
  if (saved) {
    els.names.value = saved.names;
    els.firstOnly.checked = saved.firstOnly;
    els.uppercase.checked = saved.uppercase;
    els.maxSize.value = saved.maxSize;
    els.font.value = saved.font;
  } else {
    els.names.value = 'Alice Andersen\nBob\nCharlotte\nDaniel\nEmma\nFrederik\nGustav\nHannah\nIda\nJohannes-Maximilian\nKarl';
  }

  for (const el of [els.names, els.firstOnly, els.uppercase, els.maxSize, els.font]) {
    el.addEventListener('input', render);
  }
  document.fonts.ready.then(render);
</script>
</body>
</html>
